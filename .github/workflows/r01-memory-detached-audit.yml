name: WAMBU | R01 detached retrospective memory evidence audit
on:
  push:
    branches: [revision/author-decision-50-scientific-remediation]
    paths:
      - 'protocol/R01_MEMORY_DETACHED_AUDIT_TRIGGER_2026-11-19.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  memory-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      OCTEN_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: '44557723644'
          name: wambu-r01-memory-real-44557723644
          path: runs/r01-memory-source/
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independently check 25 IDs, 24 judgments, citations, memory and source hashes
        run: |
          python -m scripts.audit_r01_memory_stress \
            --report runs/r01-memory-source/observed.json \
            --out runs/r01-memory-audit/audit.json
      - name: Protect interpretation of retrospective scores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runs/r01-memory-audit/audit.json').read_text())
          assert d['passed']
          assert d['qualified_real_action_gold']==0
          assert d['new_paid_calls']==0 and not d['holdout']
          assert d['retrospective_not_real_time_operational']
          assert d['model_memory_comparison_not_causal']
          assert not d['external_submission']
          print('R01_MEMORY_AUDIT_PASS',d['by_arm'])
          PY
      - name: Archive replay without provider calls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wambu-r01-memory-detached-${{ github.run_id }}
          path: runs/r01-memory-audit/
          if-no-files-found: warn
          retention-days: 90
