name: Article 1 | real recursive compaction pilot
on:
  workflow_dispatch:
    inputs:
      split:
        description: 'Development or exploratory pilot only. Confirmation not available here.'
        type: choice
        default: development
        required: true
        options: [development, pilot]
      episodes:
        description: 'Independent episodes; maximum 40'
        type: string
        required: true
        default: '4'
      steps:
        description: 'Agent turns per episode: 8 to 24'
        type: string
        required: true
        default: '12'
permissions:
  contents: read
concurrency:
  group: wambu-real-pilot-serial
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPLIT: ${{ inputs.split }}
      EPISODES: ${{ inputs.episodes }}
      STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate instrument before any paid call
        run: python -m unittest discover -s tests -v
      - name: Fail-closed API key and finite call preflight
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          n=int(os.environ['EPISODES']);t=int(os.environ['STEPS'])
          assert 1 <= n <= 40 and 8 <= t <= 24, 'INVALID_EPISODE_OR_STEP_COUNT'
          assert os.environ['SPLIT'] in ('development','pilot'), 'CONFIRMATORY_FORBIDDEN'
          n_calls=n*(4*t+(t-1)//3)+2
          cfg=json.loads(Path('study/model_config.json').read_text())
          assert n_calls <= cfg['budget']['max_calls'], 'FINITE_CALL_CAP'
          if not os.environ.get('OPENAI_API_KEY'):
              Path('runs/article1').mkdir(parents=True,exist_ok=True)
              Path('runs/article1/BLOCKED.txt').write_text('BLOCKED_MISSING_OPENAI_API_KEY_IN_ARTICLE_REPO\n')
              raise SystemExit('BLOCKED_MISSING_OPENAI_API_KEY_IN_ARTICLE_REPO')
          print('REAL_PROVIDER_PREFLIGHT_OK',n_calls,'calls maximum. No USD ceiling.')
          PY
      - name: Execute real recursive compaction and four paired GPT conditions
        run: |
          python scripts/run_study.py run --mode live --execute --split "$SPLIT" \
            --episodes "$EPISODES" --steps "$STEPS" \
            --ledger runs/article1/provider-ledger.json --out runs/article1/empirical
          python scripts/run_study.py verify --directory runs/article1/empirical
      - name: Execute two low-cost blind advisory reviews
        run: |
          python scripts/review_study.py --data-dir runs/article1/empirical \
            --ledger runs/article1/provider-ledger.json --out runs/article1/advisory
      - name: Check provider provenance and keep science gates closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runs/article1')
          s=json.loads((root/'empirical/summary.json').read_text())
          r=json.loads((root/'advisory/reviewers.json').read_text())
          assert s['status']=='REAL_DEVELOPMENT_OR_PILOT_OBSERVED_NOT_SCIENTIFICALLY_APPROVED'
          assert s['observed_provider_calls']==s['api_decisions_expected']+s['api_compactions_expected']
          assert len(r['reviewers'])==2 and not r['gold_labels_supplied']
          assert not s['scientifically_approved'] and not r['scientifically_approved']
          assert not s['holdout_touched'] and not r['submission_authorized']
          print('ARTICLE1_EXPLORATORY_REAL_PROVIDER_INSTRUMENT_VALIDATED')
          PY
      - name: Retain complete pilot/partial-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article1-exploratory-real-provider-${{ github.run_id }}
          path: runs/article1/
          if-no-files-found: warn
          retention-days: 90
