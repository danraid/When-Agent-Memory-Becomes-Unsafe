name: Article 1 | P08b official public sample native regex component
on:
  pull_request:
    paths:
      - '.github/workflows/p08-official-public-sample-offline.yml'
      - 'scripts/audit_official_knowledge_triage_sample.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-original-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: searchsim-org/cikm26-knowledge-triage
          ref: a6ceb01a3368cee25ef7ebcf05ebdab8c9be24a4
          path: third_party/knowledge-triage
          persist-credentials: false
      - name: Original source and zero-inference sample check
        run: |
          test -z "$OPENAI_API_KEY"
          test "$(git -C third_party/knowledge-triage rev-parse HEAD)" = "a6ceb01a3368cee25ef7ebcf05ebdab8c9be24a4"
          python scripts/audit_official_knowledge_triage_sample.py --upstream third_party/knowledge-triage --out runs/p08b-sample
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("runs/p08b-sample/official_sample_component_summary.json").read_text())
          assert r["processed_files"]==327 and r["rows"]==1308
          assert r["paid_model_calls"]==0 and r["confirmatory_touched"] is False
          assert r["paper_reproduction"] is False and r["full_framework_reproduction"] is False
          assert r["source_annotated"] is False
          assert len(r["summaries"])==4
          print("P08B_PUBLIC_SAMPLE_NATIVE_COMPONENT_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wambu-p08b-original-public-sample-${{ github.run_id }}
          path: runs/p08b-sample/
          retention-days: 90
          if-no-files-found: warn
