name: Article 1 | R02 expanded Octen + SafetyMargin development diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wambu-r02-expanded-vendor-original-model-one-shot
  cancel-in-progress: false
jobs:
  expanded-development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R02_ALLOW_LIVE_CALLS: 'true'
      R02_REQUIRE_LANE: 'OCTEN_VENDOR_AND_ORIGINAL_LLM'
      OCTEN_API_KEY: ${{ secrets.OCTEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ''
      CUSTOM_LLM_API_KEY: ''
      CUSTOM_LLM_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: searchsim-org/cikm26-knowledge-triage
          ref: a6ceb01a3368cee25ef7ebcf05ebdab8c9be24a4
          path: third_party/knowledge-triage
          persist-credentials: false
      - name: Install upstream Python imports
        run: python -m pip install 'numpy>=1.24' 'tenacity>=8.2' 'openai>=1.40' 'python-dotenv>=1.0'
      - name: Verify split, fixture cardinality and Octen-only usage
        run: python -m unittest discover -s tests -p 'test_r02_expanded_dev_contract.py' -v
      - name: Run original cascade and SafetyMargin, Octen 8B plus GPT 5.4 mini
        run: |
          python -m scripts.r02_expanded_octen_dev \
            --upstream third_party/knowledge-triage \
            --out runs/r02-expanded/diagnostic.json
      - name: Verify report was never promoted to scientific validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runs/r02-expanded/diagnostic.json').read_text())
          assert r["schema"]=="WAMBU-R02-EXPANDED-LIVE-DIAGNOSTIC-V1"
          assert r["status"] in {"EXECUTED_ALL_DEV_PROBES","PARTIAL_DEV_PROBES_WITH_FAILURES","BLOCKED_ENCODER_FIT","PRECONDITION_FAILED"}
          assert r["original_paper_benchmark_reproduced"] is False
          assert r["confirmatory_access"] is False
          assert r["external_journal_submission_authorised"] is False
          if r["status"] in {"EXECUTED_ALL_DEV_PROBES","PARTIAL_DEV_PROBES_WITH_FAILURES"}:
              assert len(r["classification_results"])==20
              assert len(r["safety_margin_results"])==6
              assert r["model_ids_requested"]=={"embedding":"octen-embedding-8b","llm":"gpt-5.4-mini"}
              assert r["no_provider_fallback"] is True
          print("R02_EXPANDED_RESEARCH_EVIDENCE",r["status"])
          PY
      - name: Archive both partial and successful original provider responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wambu-r02-expanded-octen-${{ github.run_id }}
          path: runs/r02-expanded/
          if-no-files-found: warn
          retention-days: 90
