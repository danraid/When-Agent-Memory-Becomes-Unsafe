name: Article 1 | R02 original public 40-subset detached audit
on:
  pull_request:
    paths:
      - 'scripts/audit_r02_original_public_subset.py'
      - '.github/workflows/r02-original-40-detached-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  detached-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCTEN_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: searchsim-org/cikm26-knowledge-triage
          ref: a6ceb01a3368cee25ef7ebcf05ebdab8c9be24a4
          path: third_party/knowledge-triage
          persist-credentials: false
      - name: Install source dependencies for offline source matching
        run: python -m pip install 'numpy>=1.24' 'tenacity>=8.2' 'openai>=1.40' 'python-dotenv>=1.0'
      - uses: actions/download-artifact@v4
        with:
          run-id: '44290963608'
          name: wambu-r02-original-40-44290963608
          path: runs/r02-original-40-input/
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independently reconstruct every original rule and verify recorded outcomes
        run: |
          python -m scripts.audit_r02_original_public_subset \
            --report runs/r02-original-40-input/report.json \
            --upstream third_party/knowledge-triage \
            --out runs/r02-original-40-detached/audit.json
      - name: Protect methods and scientific authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('runs/r02-original-40-detached/audit.json').read_text())
          assert a['passed'] and a['observed_total']==40
          assert a['scientific_label_type']=='PUBLIC_SOURCE_AUTHORED_CONSTRAINT_INTENT'
          assert a['new_paid_provider_calls']==0
          assert a['independent_agent_action_gold']==0
          assert not a['confirmatory_access'] and not a['original_paper_full_reproduction']
          assert not a['external_submission_authorised']
          PY
      - name: Archive zero-inference source-identity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wambu-r02-original-40-detached-${{ github.run_id }}
          path: runs/r02-original-40-detached/
          if-no-files-found: warn
          retention-days: 90
