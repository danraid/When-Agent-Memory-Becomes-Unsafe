name: Article 1 | v3 real policy supersession feasibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/study-v3-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wambu-v3-real-pilot-once-per-revision
  cancel-in-progress: false
jobs:
  temporal-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EPISODES: '4'
      STEPS: '18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify inherited and v3 validity contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify mock never becomes empirical evidence
        run: |
          python scripts/run_temporal_v3.py run --mode mock --split development \
            --episodes 2 --steps 18 --out runs/v3-mock
          python scripts/run_temporal_v3.py verify --directory runs/v3-mock
      - name: Fail-closed paid API preflight
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('protocol/TEMPORAL_V3.json').read_text())
          c=json.loads(Path('study/model_config.json').read_text())
          n=int(os.environ['EPISODES']);t=int(os.environ['STEPS'])
          assert p['status']=='EXPLORATORY_NOT_FROZEN' and p['study_id']=='WAMBU-001-V3'
          assert p['pilot']['episodes']==n and p['pilot']['steps']==t
          assert n*(5*t+(t-1)//3)==p['pilot']['max_paid_calls_before_reviews']
          assert n*(5*t+(t-1)//3)+2<=c['budget']['max_calls']
          assert c['budget']['max_usd'] is None
          assert p['author_confirmatory_approval'] is None and p['confirmation_seed'] is None
          if not os.getenv('OPENAI_API_KEY'):
              raise SystemExit('BLOCKED_MISSING_OPENAI_API_KEY_IN_ARTICLE_REPO')
          print('V3_REAL_PROVIDER_PREFLIGHT_OK; PILOT_ONLY; NO USD CAP')
          PY
      - name: Execute four independent real GPT temporal-supersession episodes
        run: |
          python scripts/run_temporal_v3.py run --mode live --execute --split pilot \
            --episodes "$EPISODES" --steps "$STEPS" \
            --ledger runs/v3-pilot/provider-ledger.json \
            --out runs/v3-pilot/empirical
          python scripts/run_temporal_v3.py verify --directory runs/v3-pilot/empirical
      - name: Two low-cost blind reviewer assessments
        run: |
          python scripts/review_temporal_v3.py --empirical runs/v3-pilot/empirical \
            --ledger runs/v3-pilot/provider-ledger.json \
            --out runs/v3-pilot/advisory
      - name: Assemble transparent descriptive report
        run: |
          python scripts/analyse_temporal_v3.py --empirical runs/v3-pilot/empirical \
            --advisory runs/v3-pilot/advisory --out runs/v3-pilot/analysis
      - name: Retain all evidence and partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wambu-v3-temporal-pilot-${{ github.run_id }}
          path: runs/v3-pilot/
          if-no-files-found: warn
          retention-days: 90
